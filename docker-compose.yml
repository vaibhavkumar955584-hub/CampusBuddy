version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: seniorconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seniorconnect}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: seniorconnect-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./seniorconnect-backend
      dockerfile: Dockerfile
    container_name: seniorconnect-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/seniorconnect}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-seniorconnect_app}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-seniorconnect_app_secret}
      SPRING_FLYWAY_USER: ${SPRING_FLYWAY_USER:-postgres}
      SPRING_FLYWAY_PASSWORD: ${SPRING_FLYWAY_PASSWORD:-postgrespassword}
      SPRING_REDIS_HOST: ${SPRING_REDIS_HOST:-redis}
      SPRING_REDIS_PORT: ${SPRING_REDIS_PORT:-6379}
      TESSDATA_PREFIX: /usr/share/tessdata
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data:
