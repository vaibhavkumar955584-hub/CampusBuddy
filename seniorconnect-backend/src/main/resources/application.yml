server:
  port: 8080
  servlet:
    context-path: /api/v1
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: seniorconnect-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/seniorconnect}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 2000ms

seniorconnect:
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:keys/private.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:keys/public.pem}
    access-token-expiration-seconds: 900 # 15 minutes
    refresh-token-expiration-seconds: 2592000 # 30 days
    issuer: seniorconnect-auth-server
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  security:
    jwt:
      private-key-path: ${JWT_PRIVATE_KEY_PATH:}
      public-key-path: ${JWT_PUBLIC_KEY_PATH:}
      access-token-expiration-seconds: 900 # 15 minutes
      refresh-token-expiration-seconds: 2592000 # 30 days
      issuer: seniorconnect-auth-server
    otp:
      expiration-seconds: 300 # 5 minutes
      max-attempts: 5
      lockout-seconds: 900 # 15 minutes
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:8080}
  ratelimit:
    auth-requests-per-hour: 5
    queries-per-day: 5
    responses-per-day: 20
    reveals-per-day: 10
  ocr:
    tessdata-path: ${TESSDATA_PREFIX:/usr/share/tessdata}
    timeout-seconds: 15
  email-parsing:
    required-domain: galgotiacollege.edu
    college-prefix: gce
    academic-start-month: 8 # August
    branches:
      bit: "Information Technology"
      it: "Information Technology"
      bcs: "Computer Science & Engineering"
      cse: "Computer Science & Engineering"
      bce: "Electronics & Communication Engineering"
      ece: "Electronics & Communication Engineering"
      bee: "Electrical & Electronics Engineering"
      eee: "Electrical & Electronics Engineering"
      bme: "Mechanical Engineering"
      me: "Mechanical Engineering"
      bcv: "Civil Engineering"
      ce: "Civil Engineering"
      bai: "Artificial Intelligence & Machine Learning"
      aiml: "Artificial Intelligence & Machine Learning"
      bds: "Data Science"
      ds: "Data Science"

logging:
  level:
    root: INFO
    com.seniorconnect: DEBUG
