spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      repositories:
        enabled: false

seniorconnect:
  security:
    jwt:
      access-token-expiration-seconds: 900
      refresh-token-expiration-seconds: 2592000
      issuer: seniorconnect-test-issuer
    otp:
      expiration-seconds: 300
      max-attempts: 5
      lockout-seconds: 900
  ratelimit:
    auth-requests-per-hour: 5
    queries-per-day: 5
    responses-per-day: 20
    reveals-per-day: 10
